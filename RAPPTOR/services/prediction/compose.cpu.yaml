version: "2.3"

services:
  redis:
    image: rapptor-prediction-cpu:latest
    command: ["redis-server", "--protected-mode", "no", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--dir", "/data/redis"]
    volumes:
      - rapptor-prediction-redis:/data/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [rapptor-prediction]

  api:
    image: rapptor-prediction-cpu:latest
    build:
      context: ../..
      dockerfile: services/prediction/Dockerfile.cpu
    command: ["python", "-m", "prediction_service"]
    environment: &service_env
      RAPPTOR_REDIS_URL: redis://redis:6379/0
      RAPPTOR_QUEUE: prediction
      RAPPTOR_MODEL_DIR: /models
      RAPPTOR_DATA_ROOT: /data
      RAPPTOR_CGR_CACHE_ROOT: ${RAPPTOR_CGR_CACHE_ROOT:-/data/cgr-cache}
      RAPPTOR_CGR_VERSION: ${RAPPTOR_CGR_VERSION:-cgr-128-v1}
      RAPPTOR_MODEL_VERSION: candidate-github-93cf
      RAPPTOR_DEVICE: cpu
      RAPPTOR_TICKET_VALIDATION_MODE: ${RAPPTOR_TICKET_VALIDATION_MODE:-disabled}
      RAPPTOR_TICKET_CONSUME_URL: ${RAPPTOR_TICKET_CONSUME_URL:-}
      RAPPTOR_TICKET_SERVICE_SECRET: ${RAPPTOR_TICKET_SERVICE_SECRET:-}
      RAPPTOR_JOB_CALLBACK_URL: ${RAPPTOR_JOB_CALLBACK_URL:-}
      RAPPTOR_JOB_CALLBACK_SECRET: ${RAPPTOR_JOB_CALLBACK_SECRET:-}
      RAPPTOR_FILE_RETENTION_SECONDS: ${RAPPTOR_FILE_RETENTION_SECONDS:-86400}
      RAPPTOR_MIN_SCAN_STRIDE: ${RAPPTOR_MIN_SCAN_STRIDE:-1}
      RAPPTOR_DEFAULT_SCAN_STRIDE: ${RAPPTOR_DEFAULT_SCAN_STRIDE:-1}
      RAPPTOR_MAX_GENOME_BASES: ${RAPPTOR_MAX_GENOME_BASES:-6000000}
      RAPPTOR_MAX_QUEUE_LENGTH: ${RAPPTOR_MAX_QUEUE_LENGTH:-100}
      RAPPTOR_DEFAULT_BATCH_SIZE: ${RAPPTOR_DEFAULT_BATCH_SIZE:-32}
    volumes:
      - rapptor-prediction-data:/data
    ports:
      - "127.0.0.1:${RAPPTOR_API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [rapptor-prediction]

  worker:
    image: rapptor-prediction-cpu:latest
    command: ["python", "-m", "prediction_service.worker"]
    environment:
      <<: *service_env
      OMP_NUM_THREADS: ${RAPPTOR_CPU_THREADS:-28}
      MKL_NUM_THREADS: ${RAPPTOR_CPU_THREADS:-28}
      OPENBLAS_NUM_THREADS: ${RAPPTOR_CPU_THREADS:-28}
    volumes:
      - rapptor-prediction-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [rapptor-prediction]

networks:
  rapptor-prediction:
    driver: bridge

volumes:
  rapptor-prediction-data:
  rapptor-prediction-redis:
